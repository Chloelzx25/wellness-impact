<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - Wellness Impact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/color.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="home.html">
            <img src="https://static.wikia.nocookie.net/gensin-impact/images/d/d4/Item_Primogem.png"
                 class="logo img-fluid" style="height: 40px; margin-right: 10px;" />
            Wellness Impact
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="challenges.html">Challenges</a></li>
                <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
                <li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <div class="d-flex align-items-center mora-display">
                        <img src="https://static.wikia.nocookie.net/gensin-impact/images/8/84/Item_Mora.png"
                             class="mora-icon me-2" style="height: 24px;" />
                        <span id="navbarMora" class="text-warning fw-bold">0</span>
                    </div>
                </li>
                <li class="nav-item">
                    <button id="logoutButton" class="btn btn-sm btn-outline-light ms-3">Logout</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="py-4">
<div class="container">
<div class="row">

<!-- LEFT SIDEBAR -->
<div class="col-lg-3 col-md-4 mb-4">
    <div class="sticky-top" style="top: 20px;">
        <div class="card mb-4">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="bi bi-coin"></i> Your Mora</h5>
            </div>
            <div class="card-body text-center">
                <div class="display-5 text-warning mb-2" id="userMora">0</div>
                <p class="text-muted mb-0">Available Balance</p>
                <div class="mt-3">
                    <button class="btn btn-sm btn-outline-warning" onclick="refreshBalance()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Shop Stats</h5>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Weapons</span>
                    <span id="weaponCount" class="text-light">0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Artifacts</span>
                    <span id="artifactCount" class="text-light">0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Consumables</span>
                    <span id="consumableCount" class="text-light">0</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Characters</span>
                    <span id="characterCount" class="text-light">0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- RIGHT CONTENT -->
<div class="col-lg-9 col-md-8">

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="text-white">Shop</h2>
        <p class="text-white mb-0">Purchase characters and items to enhance your adventurers</p>
    </div>
    <input type="text" id="searchItems" class="form-control w-50" placeholder="Search items...">
</div>

<ul class="nav nav-tabs mb-4">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#weapons"><i class="bi bi-sword"></i> Weapons</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#artifacts"><i class="bi bi-gem"></i> Artifacts</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#consumables"><i class="bi bi-cup"></i> Consumables</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#characters"><i class="bi bi-people"></i> Characters</button></li>
</ul>

<div class="tab-content">
    <div class="tab-pane fade show active" id="weapons"><div class="row" id="weaponsGrid"></div></div>
    <div class="tab-pane fade" id="artifacts"><div class="row" id="artifactsGrid"></div></div>
    <div class="tab-pane fade" id="consumables"><div class="row" id="consumablesGrid"></div></div>
    <div class="tab-pane fade" id="characters"><div class="row" id="charactersGrid"></div></div>
</div>

</div>
</div>
</div>
</main>

<!-- PURCHASE MODAL -->
<div class="modal fade" id="purchaseModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content bg-dark border-primary">
<div class="modal-header border-primary">
    <h5 class="modal-title text-primary" id="modalTitle">
        <i class="bi bi-cart-check"></i> Purchase Item
    </h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body text-center">
    <div id="modalItemImage" class="mb-3"></div>
    <h4 id="modalItemName" class="text-white"></h4>

    <div class="d-flex justify-content-center gap-2 mb-2">
        <span id="modalItemType" class="badge bg-secondary"></span>
        <span id="modalItemPrice" class="badge bg-success"></span>
    </div>

    <p id="modalItemDescription" class="text-light"></p>

<div class="modal-footer border-primary">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="button" class="btn btn-primary" id="confirmPurchase">
        <i class="bi bi-cart-check"></i> Confirm Purchase
    </button>
</div>
</div>
</div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/getCurrentURL.js"></script>
<script src="js/utils.js"></script>
<script src="js/queryCmds.js"></script>
<script src="js/userNavbarToggle.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
