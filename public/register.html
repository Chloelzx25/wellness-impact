<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Wellness Impact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/color.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://static.wikia.nocookie.net/gensin-impact/images/d/d4/Item_Primogem.png" 
                    class="logo img-fluid" style="height: 40px; margin-right: 10px;" />
                Wellness Impact
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card fade-in">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-white">Create Account</h2>
                        <p class="text-center text-light mb-4">Start your wellness adventure today!</p>
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label text-light">Username</label>
                                <input type="text" class="form-control" id="username" required
                                    placeholder="Choose a username">
                                <div class="form-text text-light">This will be your display name</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label text-light">Email</label>
                                <input type="email" class="form-control" id="email" required
                                    placeholder="Enter your email">
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label text-light">Password</label>
                                <input type="password" class="form-control" id="password" required
                                    placeholder="Create a password">
                                <div class="form-text text-light">At least 6 characters</div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label text-light">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required
                                    placeholder="Confirm your password">
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Create Account
                                </button>
                                <a href="login.html" class="btn btn-outline-light">
                                    Already have an account? Login
                                </a>
                            </div>
                        </form>
                        
                        <div class="mt-4 text-center">
                            <p class="text-light small">
                                By registering, you'll receive Amber as your starting character!
                            </p>
                            <img src="https://static.wikia.nocookie.net/gensin-impact/images/7/75/Amber_Icon.png/revision/latest?cb=20210213161233" 
                                class="img-fluid" style="max-width: 100px; border-radius: 50%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/getCurrentURL.js"></script>
<script src="js/utils.js"></script>
<script src="js/queryCmds.js"></script>
<script src="js/registerUser.js"></script>

</body>
</html>
