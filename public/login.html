<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wellness Impact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/color.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="https://static.wikia.nocookie.net/gensin-impact/images/d/d4/Item_Primogem.png" 
                    class="logo img-fluid" style="height: 40px; margin-right: 10px;" />
                Wellness Impact
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card fade-in">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-white">Welcome Back</h2>
                        <p class="text-center text-light mb-4">Continue your wellness adventure</p>
                        <div id="warningCard" class="alert alert-danger d-none">
                            <span id="warningText"></span>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label text-light">Username</label>
                                <input type="text" class="form-control" id="username" required
                                    placeholder="Enter your username">
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label text-light">Password</label>
                                <input type="password" class="form-control" id="password" required
                                    placeholder="Enter your password">
                            </div>
                            
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Login
                                </button>
                            </div>
                            
                            <div class="text-center">
                                <a href="register.html" class="text-light">Don't have an account? Register</a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="mt-4 text-center">
                    <p class="text-light small">
                        • Register new account to get Amber starter character
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/getCurrentURL.js"></script>
<script src="js/utils.js"></script>
<script src="js/queryCmds.js"></script>
<script src="js/loginUser.js"></script>

</body>
</html>
