<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Wellness Impact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/color.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="https://static.wikia.nocookie.net/gensin-impact/images/d/d4/Item_Primogem.png"
             class="logo img-fluid" style="height: 40px; margin-right: 10px;" />
        Wellness Impact
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="challenges.html">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link active" href="inventory.html">Inventory</a></li>
        </ul>

        <ul class="navbar-nav ms-auto" id="navbarUser">
          <!-- userNavbarToggle.js will populate -->
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="text-white mb-1">Inventory</h1>
        <p class="text-light mb-0">Equip characters, weapons, artifacts, and use food.</p>
      </div>
      <button class="btn btn-outline-light" id="refreshInventoryBtn">Refresh</button>
    </div>

    <!-- Equipped character card (required by inventory.js) -->
    <div class="mb-4" id="equippedCharacterCard">
      <div class="text-center py-4">
        <div class="loading-spinner mx-auto my-3"></div>
        <p class="text-light mb-0">Loading equipped character...</p>
      </div>
    </div>

    <ul class="nav nav-tabs mb-3" id="inventoryTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-characters" type="button">
          Characters
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-weapons" type="button">
          Weapons
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-artifacts" type="button">
          Artifacts
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-food" type="button">
          Food
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-characters">
        <div id="charactersList"></div>
      </div>

      <div class="tab-pane fade" id="tab-weapons">
        <div id="weaponsTab"></div>
      </div>

      <div class="tab-pane fade" id="tab-artifacts">
        <div id="artifactsTab"></div>
      </div>

      <div class="tab-pane fade" id="tab-food">
        <div id="foodTab"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/getCurrentURL.js"></script>
<script src="js/utils.js"></script>
<script src="js/queryCmds.js"></script>
<script src="js/userNavbarToggle.js"></script>
<script src="js/inventory.js"></script>

</body>
</html>
